
# 1. THE APP: Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: pythonapp-dev
  labels:
    app: weather-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      serviceAccountName: weather-app-sa # Tells K8s to use the IAM role above
      containers:
      - name: weather-app
        image: pankswork/weather-app:latest # Your Docker Hub image
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        
        # Environment Variables for app.py logic
        env:
        - name: USE_AWS_SECRETS
          value: "true"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_SECRET_NAME
          value: "weather-app-db-creds"
        - name: AWS_API_KEY_SECRET_NAME
          value: "weather-api-key-secret"

        # Resources: Prevents one pod from crashing the whole node
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        # Probes: EKS will auto-restart the pod if /health fails
        # This keeps the app alive for up to 5 minutes while it waits for RDS
        startupProbe:
          httpGet:
            path: /health
            port: 5000
          failureThreshold: 30
          periodSeconds: 10
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 30
          
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          periodSeconds: 10