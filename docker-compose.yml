version: "3.9"

services:
  app:
    build: .
    container_name: weather-app
    ports:
      - "5000:5000"
    # Use env_file for non-sensitive config, but inject secrets specifically
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD} # Injected from host/shell
    depends_on:
      db:
        condition: service_healthy
    # Hardening: Prevent container from gaining new privileges
    security_opt:
      - no-new-privileges:true

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      # FIX: MySQL 8.0 healthcheck requires specific flags to avoid login noise in logs
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro # Mount as Read-Only

volumes:
  db_data:
